[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-transforms"
version = "0.2.4"
description = "Shared PySpark transformations for the NYC Taxi pipeline"
requires-python = ">=3.10"

[project.scripts]
encrypt_customers = "encrypt_customers_job:main"

[tool.setuptools]
py-modules = ["trip_transforms", "customer_pool", "encrypt_customers_job"]
